services:
  demo:
    build:
      context: .
      dockerfile: config/demo/Dockerfile
    ports:
      - "127.0.0.1:${DEMO_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/control').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  demo-seed:
    build:
      context: .
      dockerfile: config/demo/Dockerfile
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: ["node", "seed.mjs"]
    depends_on:
      app:
        condition: service_started
      demo:
        condition: service_healthy
  demo-tools:
    profiles: ["demo-tools"]
    build:
      context: .
      dockerfile: config/demo/tools.Dockerfile
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./.validation/demo:/reports
    entrypoint: ["node", "scenario.mjs"]
    shm_size: 256mb
  smtp:
    image: axllent/mailpit:v1.27.8
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - smtp-data:/data
    ports:
      - "127.0.0.1:${SMTP_UI_PORT:-8025}:8025"
      - "127.0.0.1:${SMTP_LOCAL_PORT:-1025}:1025"
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-monitor}
      POSTGRES_USER: ${DB_USER:-monitor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  app:
    image: monitor-disponibilidade:local
    build:
      context: .
      target: runtime
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-monitor}
      DB_USER: ${DB_USER:-monitor}
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MONITOR_DEMO_ORIGIN: ${MONITOR_DEMO_ORIGIN:-}
      MONITOR_CHECK_CONCURRENCY: ${MONITOR_CHECK_CONCURRENCY:-4}
      MONITOR_SCHEDULER_POLL_MS: ${MONITOR_SCHEDULER_POLL_MS:-250}
      MONITOR_SCHEDULER_ENABLED: ${MONITOR_SCHEDULER_ENABLED:-true}
      MONITOR_NOTIFICATIONS_ENABLED: ${MONITOR_NOTIFICATIONS_ENABLED:-true}
      MONITOR_NOTIFICATIONS_POLL_MS: ${MONITOR_NOTIFICATIONS_POLL_MS:-250}
      MONITOR_RETENTION_ENABLED: ${MONITOR_RETENTION_ENABLED:-true}
      MONITOR_RETENTION_DAYS: ${MONITOR_RETENTION_DAYS:-30}
      MONITOR_RETENTION_BATCH_SIZE: ${MONITOR_RETENTION_BATCH_SIZE:-1000}
      MONITOR_RETENTION_POLL_MS: ${MONITOR_RETENTION_POLL_MS:-3600000}
      SMTP_HOST: ${SMTP_HOST:-smtp}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-monitor@example.org}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_CONNECT_TIMEOUT_MS: ${SMTP_CONNECT_TIMEOUT_MS:-5000}
      SMTP_READ_TIMEOUT_MS: ${SMTP_READ_TIMEOUT_MS:-3000}
      SMTP_WRITE_TIMEOUT_MS: ${SMTP_WRITE_TIMEOUT_MS:-5000}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
  panel-db:
    profiles: ["panel-tests"]
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: panel
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: panel-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel -d panel"]
      interval: 2s
      timeout: 3s
      retries: 30
  panel-app:
    profiles: ["panel-tests"]
    build:
      context: .
      target: runtime
    environment:
      DB_URL: jdbc:postgresql://panel-db:5432/panel
      DB_USER: panel
      DB_PASSWORD: panel-test-only
      ADMIN_USERNAME: panel-test-operator
      ADMIN_PASSWORD: panel-test-only
      MONITOR_DEMO_ORIGIN: http://panel-tests:9080
      MONITOR_NOTIFICATIONS_ENABLED: "false"
    depends_on:
      panel-db:
        condition: service_healthy
  panel-tests:
    profiles: ["panel-tests"]
    build:
      context: .
      dockerfile: config/panel/Dockerfile
    init: true
    shm_size: 256mb
    volumes:
      - ./.validation/panel:/reports
    depends_on:
      panel-app:
        condition: service_started
  tests:
    profiles: ["tests"]
    build:
      context: .
      target: source
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
      TESTCONTAINERS_HOST_OVERRIDE: ${TESTCONTAINERS_HOST_OVERRIDE:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - maven-cache:/root/.m2
      - ./target:/reports
    command: ["sh", "config/run-tests.sh"]

volumes:
  postgres-data:
  smtp-data:
  maven-cache:
