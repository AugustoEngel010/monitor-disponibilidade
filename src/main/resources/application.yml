monitor:
  retention:
    enabled: ${MONITOR_RETENTION_ENABLED:true}
    days: ${MONITOR_RETENTION_DAYS:30}
    batch-size: ${MONITOR_RETENTION_BATCH_SIZE:1000}
    poll-ms: ${MONITOR_RETENTION_POLL_MS:3600000}
  notifications:
    enabled: ${MONITOR_NOTIFICATIONS_ENABLED:true}
    poll-ms: ${MONITOR_NOTIFICATIONS_POLL_MS:250}
  smtp:
    host: ${SMTP_HOST:smtp}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:monitor@example.org}
    auth: ${SMTP_AUTH:false}
    starttls: ${SMTP_STARTTLS:false}
    ssl: ${SMTP_SSL:false}
    connect-timeout-ms: ${SMTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${SMTP_READ_TIMEOUT_MS:3000}
    write-timeout-ms: ${SMTP_WRITE_TIMEOUT_MS:5000}
  demo-origin: ${MONITOR_DEMO_ORIGIN:}
  scheduler:
    enabled: ${MONITOR_SCHEDULER_ENABLED:true}
    concurrency: ${MONITOR_CHECK_CONCURRENCY:4}
    poll-ms: ${MONITOR_SCHEDULER_POLL_MS:250}
spring:
  application:
    name: monitor-disponibilidade
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/monitor}
    username: ${DB_USER:monitor}
    password: ${DB_PASSWORD:local-development-only}
    hikari:
      connection-timeout: 2000
  flyway:
    enabled: true
    default-schema: public
    schemas: public
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
logging:
  structured:
    format:
      console: ecs
  level:
    org.springframework.boot.actuate.jdbc.DataSourceHealthIndicator: OFF
