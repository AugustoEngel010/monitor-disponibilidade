spring:
  application:
    name: monitor-disponibilidade
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/monitor}
    username: ${DB_USER:monitor}
    password: ${DB_PASSWORD:local-development-only}
    hikari:
      connection-timeout: 2000
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
